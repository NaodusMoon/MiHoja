# =========================
# Nombre y puerto
# =========================
spring.config.import=optional:file:.env[.properties],optional:file:./MiHoja/.env[.properties]
spring.application.name=MiHoja
server.port=${SERVER_PORT:8080}

# =========================
# Conexion a base de datos
# =========================
# La aplicacion usa solo PostgreSQL en Supabase.
spring.datasource.url=${MIHOJA_DB_URL:${SUPABASE_DB_URL:}}
spring.datasource.username=${MIHOJA_DB_USERNAME:${SUPABASE_DB_USERNAME:}}
spring.datasource.password=${MIHOJA_DB_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# Hibernate / JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optimizacion para batch
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =========================
# Configuracion para subir archivos
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB

# Ajustes de Tomcat para evitar limites internos
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

# =========================
# Thymeleaf
# =========================
spring.thymeleaf.cache=false

# =========================
# Logging
# =========================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# =========================
# Storage
# =========================
app.storage.provider=${MIHOJA_STORAGE_PROVIDER:${SUPABASE_STORAGE_PROVIDER:local}}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:mihoja}
app.storage.supabase.public-bucket=${SUPABASE_STORAGE_PUBLIC:true}

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.browser-session.auto-shutdown-enabled=${MIHOJA_AUTO_SHUTDOWN_ENABLED:false}

# =========================
# Rutas estaticas para imagenes
# =========================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

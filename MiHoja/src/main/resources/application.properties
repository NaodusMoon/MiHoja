# =========================
# Nombre y puerto
# =========================
spring.application.name=MiHoja
server.port=${SERVER_PORT:8080}

# =========================
# Conexion a base de datos
# =========================
# Unicamente PostgreSQL (Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?user=postgres.bcwjhijmakcbbeixyutz&password=Contrase%C3%B1a1303&sslmode=require&prepareThreshold=0&preparedStatementCacheQueries=0&preferQueryMode=simple}
spring.datasource.username=${DB_USERNAME:postgres.bcwjhijmakcbbeixyutz}
spring.datasource.password=${DB_PASSWORD:Contrase\u00f1a1303}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# Hibernate / JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optimizacion para batch
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# =========================
# Configuracion para subir archivos
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB

# Ajustes de Tomcat para evitar limites internos
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

# =========================
# Thymeleaf
# =========================
spring.thymeleaf.cache=false

# =========================
# Logging
# =========================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# =========================
# Rutas estaticas para imagenes
# =========================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

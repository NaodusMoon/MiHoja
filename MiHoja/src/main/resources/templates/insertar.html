<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Hojas de Vida</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/interactive-ui.css">
    
</head>
<body data-page="insertar">

<!-- Navbar -->
<div class="navbar">
    <a class="logo"
       th:href="${#strings.isEmpty(filtrosQuery)} ? @{/consultar} : '/consultar?' + ${filtrosQuery}"><span class="logo-monogram" aria-hidden="true"><span>M</span><span>H</span></span></a>

    <a class="app-name"
       th:href="${#strings.isEmpty(filtrosQuery)} ? @{/consultar} : '/consultar?' + ${filtrosQuery}">
        MiHoja
    </a>

    <div class="nav-links">
        <a th:href="${#strings.isEmpty(filtrosQuery)} ? @{/consultar} : '/consultar?' + ${filtrosQuery}"
           th:classappend="${paginaActual == 'consultar'} ? ' active'">
            Consultar
        </a>

        <a th:href="${#strings.isEmpty(filtrosQuery)} ? @{/insertar} : '/insertar?' + ${filtrosQuery}"
           th:classappend="${paginaActual == 'insertar'} ? ' active'">
            Insertar
        </a>
        <a th:href="@{/configuracion-campos}">Campos</a>
    </div></div>











<!-- Mensajes desde controlador -->
<div th:if="${mensajeExito}" class="mensaje exito" th:text="${mensajeExito}"></div>
<div th:if="${mensajeError}" class="mensaje error" th:text="${mensajeError}"></div>

<!-- Botón flotante para subir archivo -->
<button type="button" class="archivo-btn" onclick="document.getElementById('archivo').click()">Insertar desde archivo</button>
<input type="file" id="archivo" name="archivo" accept=".xlsx" style="display:none" onchange="subirArchivo()">
<!-- Formulario SOLO para la imagen -->
<form id="form-imagen" method="post" enctype="multipart/form-data" style="margin-top: 80px;">
    <div class="image-upload-panel">
        <div class="image-upload-preview">
            <img id="previewImagen" src="" alt="Previsualización" style="width: 100%; height: 100%; object-fit: cover; display: none;">
        </div>
        <label class="image-upload-trigger" for="imagen">
            <span class="image-upload-trigger-icon" aria-hidden="true">+</span>
            <span>Seleccionar imagen</span>
        </label>
        <div class="image-upload-status" id="imagenNombre">Ninguna imagen seleccionada</div>
        <input type="file" id="imagen" name="imagen" accept="image/*" class="sr-only-file">
        <!-- Campo oculto para guardar la URL de la imagen subida -->
        <input type="hidden" id="imagen_url" name="imagen_url">
    </div>
</form>

<!-- Formulario principal SOLO para datos -->
<form id="formulario-insercion" method="post" action="/api/insertar" style="margin-top: 40px;">
    <div class="form-container">
        <th:block th:if="${camposBaseVisibles != null}">
            <th:block th:each="campo : ${camposBaseVisibles}">
                <th:block th:if="${campo.nombre != 'imagen_url'}">
                    <div class="form-group">
                        <label th:for="${campo.nombre}" th:text="${campo.etiqueta}">Campo</label>
                        <th:block th:if="${campo.nombre == 'estado'}">
                            <select th:id="${campo.nombre}" th:name="${campo.nombre}">
                                <option value="activo">Activo</option>
                                <option value="retirado">Retirado</option>
                            </select>
                        </th:block>
                        <th:block th:unless="${campo.nombre == 'estado'}">
                            <th:block th:if="${campo.nombre == 'examen' or campo.nombre == 'induccion' or campo.nombre == 'carnetVacunacion'}">
                                <select th:id="${campo.nombre}" th:name="${campo.nombre}">
                                    <option value="false">No</option>
                                    <option value="true">Sí</option>
                                </select>
                            </th:block>
                            <th:block th:unless="${campo.nombre == 'examen' or campo.nombre == 'induccion' or campo.nombre == 'carnetVacunacion'}">
                                <th:block th:switch="${campo.tipoDato}">
                                    <textarea th:case="'textarea'" th:id="${campo.nombre}" th:name="${campo.nombre}"></textarea>
                                    <input th:case="'numero'" type="number" step="any" th:id="${campo.nombre}" th:name="${campo.nombre}"
                                           th:attr="min=${campo.nombre == 'numero_hijos' ? 0 : null}">
                                    <input th:case="'fecha'" type="date" th:id="${campo.nombre}" th:name="${campo.nombre}">
                                    <select th:case="'booleano'" th:id="${campo.nombre}" th:name="${campo.nombre}">
                                        <option value="">Sin definir</option>
                                        <option value="SI">Si</option>
                                        <option value="NO">No</option>
                                    </select>
                                    <input th:case="*" th:type="${campo.nombre == 'correoInstitucional' ? 'email' : 'text'}"
                                           th:id="${campo.nombre}" th:name="${campo.nombre}"
                                           th:attr="required=${campo.nombre == 'nombres' or campo.nombre == 'apellidos' or campo.nombre == 'cedula' ? 'required' : null}">
                                </th:block>
                            </th:block>
                        </th:block>
                    </div>
                </th:block>
            </th:block>
        </th:block>
        <th:block th:if="${camposCustom != null and !#lists.isEmpty(camposCustom)}">
            <th:block th:each="campo : ${camposCustom}">
                <div class="form-group" th:switch="${campo.tipoDatoNormalizado}">
                    <label th:for="${'campo_custom_' + campo.id}" th:text="${campo.etiquetaVisible}">Campo personalizado</label>
                    <textarea th:case="'textarea'" th:id="${'campo_custom_' + campo.id}" th:name="${'campo_custom_' + campo.id}"></textarea>
                    <input th:case="'numero'" type="number" step="any" th:id="${'campo_custom_' + campo.id}" th:name="${'campo_custom_' + campo.id}">
                    <input th:case="'fecha'" type="date" th:id="${'campo_custom_' + campo.id}" th:name="${'campo_custom_' + campo.id}">
                    <select th:case="'booleano'" th:id="${'campo_custom_' + campo.id}" th:name="${'campo_custom_' + campo.id}">
                        <option value="">Sin definir</option>
                        <option value="SI">Si</option>
                        <option value="NO">No</option>
                    </select>
                    <input th:case="*" type="text" th:id="${'campo_custom_' + campo.id}" th:name="${'campo_custom_' + campo.id}">
                </div>
            </th:block>
        </th:block>
<!-- Campo oculto para incluir la URL de imagen subida -->
        <input type="hidden" id="imagen_url_datos" name="imagen_url">
    </div>

    <button type="submit" class="submit-btn">Insertar</button>
</form>


<!-- Mensaje flotante -->
<div id="mensaje" class="mensaje" style="display:none"></div>

<!-- Mensaje de progreso -->
<div id="progreso" style="display:none;">
    <div class="progress-orb" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div class="progress-copy">
        <strong>Procesando carga</strong>
        <span>Subiendo datos, por favor espere...</span>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const imagenInput = document.getElementById('imagen');
    const preview = document.getElementById('previewImagen');
    const progreso = document.getElementById('progreso');
    const imagenNombre = document.getElementById('imagenNombre');

    // Campo oculto para guardar la URL de la imagen
    const inputHidden = document.createElement('input');
    inputHidden.type = 'hidden';
    inputHidden.name = 'imagen_url';
    document.getElementById('formulario-insercion').appendChild(inputHidden);

    // Previsualizar y subir imagen al seleccionar
    imagenInput.addEventListener('change', async function (event) {
        const file = event.target.files[0];
        if (!file) {
            preview.src = '';
            preview.style.display = 'none';
            inputHidden.value = '';
            if (imagenNombre) {
                imagenNombre.textContent = 'Ninguna imagen seleccionada';
            }
            return;
        }

        if (imagenNombre) {
            imagenNombre.textContent = file.name;
        }

        // Previsualizar
        const reader = new FileReader();
        reader.onload = function (e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        // Mostrar progreso
        progreso.style.display = 'flex';

        // Subir al backend
        const formData = new FormData();
        formData.append('imagen', file);

        try {
            const resp = await fetch('/api/imagenes/subir', {
                method: 'POST',
                body: formData
            });

            if (!resp.ok) throw new Error('Error al subir imagen');

            const data = await resp.json();
            inputHidden.value = data.url; // /uploads/archivo.jpg
            mostrarToast('Imagen subida correctamente', true);
        } catch (err) {
            mostrarToast('Error al subir la imagen', false);
            console.error(err);
        } finally {
            progreso.style.display = 'none';
        }
    });

    // Enviar el formulario como application/x-www-form-urlencoded
    document.getElementById('formulario-insercion').addEventListener('submit', async function (e) {
        e.preventDefault();
        const form = e.target;
        const datos = Object.fromEntries(new FormData(form).entries());

        // Mostrar progreso
        progreso.style.display = 'flex';

        try {
            const resp = await fetch(form.action, {
                method: 'POST',
                body: new URLSearchParams(datos)
            });

            if (resp.ok) {
                mostrarToast('Datos enviados correctamente', true);
                form.reset();
                preview.style.display = 'none';
                inputHidden.value = '';
            } else {
                mostrarToast('Error al enviar datos', false);
            }
        } catch (err) {
            mostrarToast('Error de conexión', false);
            console.error(err);
        } finally {
            progreso.style.display = 'none';
        }
    });

    // Nuevo: Toast flotante
    window.mostrarToast = function (texto, exito) {
        const toast = document.createElement('div');
        toast.className = 'toast ' + (exito ? 'success' : 'error');
        toast.textContent = texto;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }
});

// Función para subir archivo Excel con barra de progreso
async function subirArchivo() {
    const archivoInput = document.getElementById('archivo');
    const file = archivoInput.files[0];

    if (!file) {
        alert("Selecciona un archivo .xlsx");
        return;
    }

    const formData = new FormData();
    formData.append('file', file); // Debe coincidir con @RequestParam("file")

    try {
        const resp = await fetch('/api/upload-jobs/excel', {
            method: 'POST',
            body: formData
        });

        const data = await resp.json();
        if (!resp.ok || !data.ok) throw new Error(data.message || "Error al subir archivo");

        if (window.miHojaTrackUpload) {
            window.miHojaTrackUpload(data.jobId);
        }
        mostrarToast("La carga sigue ejecutándose aunque cambies de página.", true);
        archivoInput.value = "";
    } catch (err) {
        console.error(err);
        mostrarToast(err.message || "Error subiendo archivo", false);
    }
}</script>
<script src="/js/insertar-enhancements.js"></script>
<script src="/js/global-upload-tracker.js"></script>










</body>
</html>

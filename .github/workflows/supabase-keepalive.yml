name: Keep Supabase active

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  query-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query MiHoja health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            --max-time 30 \
            https://mihojaactualizada.vercel.app/api/health/supabase
